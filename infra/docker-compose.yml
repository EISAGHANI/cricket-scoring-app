# Local development dependencies. Start with `pnpm infra:up`; credentials match the .env.example files.
name: cricket-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: cricket
      POSTGRES_DB: cricket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket -d cricket"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. MinIO no longer publishes images to Docker Hub (see ADR-0009).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: cricket
      RUSTFS_SECRET_KEY: cricket-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - s3-data:/data

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  s3-data:
